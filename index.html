<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hide Div on Browser Back</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* styles.css */
      #content {
        padding: 20px;
        background-color: lightblue;
        border: 1px solid #000;
      }
    </style>
  </head>
  <body>
    <div id="content">
      <p>This is the content inside the div.</p>
    </div>
<p>gui</p>
    <script>
      // script.js

      // Function to hide the div
      function hideDiv() {
        document.getElementById("content").style.display = "none";
      }

      // Push an initial state to the history stack
      history.pushState({ page: 1 }, "title 1", "#page1");

      // Add an event listener for the popstate event
      window.addEventListener("popstate", function (event) {
        if (event.state && event.state.page === 1) {
          hideDiv();
        }
      });

      // Optionally, push another state to the history stack so that the user can go back again
      // Uncomment this line if you want the div to reappear when the user navigates forward
      // history.pushState({ page: 2 }, "title 2", "#page2");
    </script>
  </body>
</html>
